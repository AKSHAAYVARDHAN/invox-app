<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invox - Fuel Curiosity, Expand Consciousness</title>
    <meta name="description" content="A dynamic platform that empowers curious minds to connect, engage, and share ideas. A robust hub for thought-sharing and networking with like-minded comrades, powered by AI." />
    <meta property="og:title" content="Invox - Fuel Curiosity, Expand Consciousness" />
    <meta property="og:description" content="A dynamic platform that empowers curious minds to connect, engage, and share ideas. A robust hub for thought-sharing and networking with like-minded comrades, powered by AI." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
      /* === RESPONSIVE GLOBAL RESETS === */
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #080808;
        color: #f4f4f5;
        letter-spacing: -0.01em;
      }
      #root {
        overflow-x: hidden;
      }
      /* Technical Code / Monospace styling */
      .font-mono {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
      }
      .pseudo-fullscreen {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 2147483647 !important;
        background-color: black !important;
        margin: 0 !important;
        padding: 0 !important;
        border-radius: 0 !important;
      }
      .pseudo-fullscreen video {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
      }
      @keyframes wave {
        0%, 100% { transform: scaleY(0.4); }
        50% { transform: scaleY(1); }
      }
      .wave-bar {
        animation: wave 1.2s ease-in-out infinite;
        transform-origin: bottom;
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeInUp {
        animation: fadeInUp 0.3s ease-out forwards;
      }
      .animated-gradient-border::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(90deg, #3f3f46, #71717a);
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
                mask-composite: exclude;
        opacity: 0;
        transition: opacity 0.2s ease-in-out;
        pointer-events: none;
      }
      .animated-gradient-border:hover::before {
        opacity: 1;
      }
      .blur-background {
        filter: blur(8px);
        transition: filter 0.2s ease-in-out;
      }
      pre > code.hljs {
        background-color: transparent !important;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Custom Minimal Scrollbar for lists */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #080808;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }
      @keyframes slideInUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-message-in {
        animation: slideInUp 0.25s ease-out forwards;
      }
    </style>
  </head>
  <body class="bg-invox-dark text-white antialiased selection:bg-zinc-800 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
